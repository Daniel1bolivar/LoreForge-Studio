name: Compilar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicacion web
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Dar permisos de ejecucion a Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Decodificar keystore persistente PKCS12 y compilar APK
        env:
          LOREFORGE_KEYSTORE_BASE64: ${{ secrets.LOREFORGE_KEYSTORE_BASE64 }}
          LOREFORGE_STORE_PASSWORD: ${{ secrets.LOREFORGE_STORE_PASSWORD }}
          LOREFORGE_KEY_ALIAS: ${{ secrets.LOREFORGE_KEY_ALIAS }}
          LOREFORGE_KEY_PASSWORD: ${{ secrets.LOREFORGE_KEY_PASSWORD }}
        run: |
          if [ -n "$LOREFORGE_KEYSTORE_BASE64" ]; then
            KS_FILE="${{ github.workspace }}/android/app/loreforge-release.p12"
            echo "$LOREFORGE_KEYSTORE_BASE64" | base64 -d > "$KS_FILE"
            export LOREFORGE_KEYSTORE_PATH="$KS_FILE"
            cd android
            ./gradlew assembleRelease --no-daemon
          else
            cd android
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: LoreForgeStudio-v1.1.0.apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
