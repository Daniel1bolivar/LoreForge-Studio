name: Compilar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicacion web
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Permisos de ejecucion a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: LoreForgeStudio-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
